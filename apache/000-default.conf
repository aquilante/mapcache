# vim: syntax=apache ts=4 sw=4 sts=4 sr noet
<VirtualHost *:8081>
        # The ServerName directive sets the request scheme, hostname and port that
        # the server uses to identify itself. This is used when creating
        # redirection URLs. In the context of virtual hosts, the ServerName
        # specifies what hostname must appear in the request's Host: header to
        # match this virtual host. For the default virtual host (this file) this
        # value is not decisive as it is used as a last resort host regardless.
        # However, you must set it for any further virtual host explicitly.
        #ServerName www.example.com
   
        ServerAdmin webmaster@localhost
        DocumentRoot /var/www/html

        # Available loglevels: trace8, ..., trace1, debug, info, notice, warn,
        # error, crit, alert, emerg.
        # It is also possible to configure the loglevel for particular
        # modules, e.g.
        #LogLevel info ssl:warn

        # ErrorLog \${APACHE_LOG_DIR}/error.log
        # CustomLog \${APACHE_LOG_DIR}/access.log combined

        #SetEnvIf X-Forwarded-For "^.*\..*\..*\..*" forwarded
        #LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
        #LogFormat "%{X-Forwarded-For}i %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\""proxy
        #CustomLog ${APACHE_LOG_DIR}/access.log combined env=!forwarded
        #CustomLog ${APACHE_LOG_DIR}/access.log proxy env=forwarded        

        # For most configuration files from conf-available/, which are
        # enabled or disabled at a global level, it is possible to
        # include a line for only one particular virtual host. For example the
        # following line enables the CGI configuration for this host only
        # after it has been globally disabled with "a2disconf".
        #Include conf-available/serve-cgi-bin.conf

        Header set Access-Control-Allow-Origin "*"

        PassEnv MAPSERVER_CONFIG_FILE MS_ERRORFILE MS_DEBUGLEVEL
        
        FcgidInitialEnv MAPSERVER_CONFIG_FILE /mnt/nfs/mapfiles/mapserver.conf
        FcgidInitialEnv MAPCACHE_CONFIG_FILE /mnt/nfs/mapfiles/mapcache_gwis.xml
        FcgidMaxProcessesPerClass 1000
        
        ScriptAlias "/effis" "/usr/lib/cgi-bin/mapserv"
        SetEnvIf Request_URI "/effis" MS_MAPFILE=/mnt/nfs/mapfiles/effis.map
        <Location "/effis">
                Options +ExecCGI -MultiViews +FollowSymLinks
                AddHandler fcgid-script .fcgi
                SetHandler fcgid-script
                Require all granted
        </Location>

        ScriptAlias "/gwis" "/usr/lib/cgi-bin/mapserv"
        SetEnvIf Request_URI "/gwis" MS_MAPFILE=/mnt/nfs/mapfiles/gwis.map
        SetEnvIf Request_URI "/gwis" NLS_LANG=American
        SetEnvIf Request_URI "/gwis" NLS_DATE_FORMAT=YYYY-MM-DD
        <Location "/gwis">
                Options +ExecCGI -MultiViews +FollowSymLinks
                AddHandler fcgid-script .fcgi
                SetHandler fcgid-script
                Require all granted
        </Location>

        ScriptAlias "/effist" "/usr/lib/cgi-bin/mapcache"
        SetEnvIf Request_URI "/effist" MAPCACHE_CONFIG_FILE /mnt/nfs/mapfiles/mapcache_effis.xml
        SetEnvIf Request_URI "/effist" PATH_INFO /        
        <Location "/effist">
                Options +ExecCGI -MultiViews +FollowSymLinks
                AddHandler fcgid-script .fcgi
                SetHandler fcgid-script
                Require all granted
        </Location>

        ScriptAlias "/gwist" "/usr/lib/cgi-bin/mapcache"
        SetEnvIf Request_URI "/gwist" NLS_LANG American
        SetEnvIf Request_URI "/gwist" NLS_DATE_FORMAT YYYY-MM-DD
        SetEnvIf Request_URI "/gwist" MAPCACHE_CONFIG_FILE /mnt/nfs/mapfiles/mapcache_gwis.xml
        SetEnvIf Request_URI "/gwist" PATH_INFO /        
        <Location "/gwist">
                Options +ExecCGI -MultiViews +FollowSymLinks
                AddHandler fcgid-script .fcgi
                SetHandler fcgid-script
                Require all granted
        </Location>


        ScriptAlias "/" "/usr/lib/cgi-bin/mapserv"
        <Location "/">
                Options +ExecCGI -MultiViews +FollowSymLinks
                AddHandler fcgid-script .fcgi
                SetHandler fcgid-script
                Require all granted
        </Location>

</VirtualHost>
